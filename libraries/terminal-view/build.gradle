plugins { id 'com.android.library' }
android {
    namespace 'com.termux.view'
    compileSdk 35
    defaultConfig { minSdk 26 }
    sourceSets.main {
        java.srcDirs = ['../../vendor/termux-app/terminal-view/src/main/java']
        res.srcDirs = ['../../vendor/termux-app/terminal-view/src/main/res']
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { api project(':terminal-emulator'); implementation 'androidx.annotation:annotation:1.3.0' }
