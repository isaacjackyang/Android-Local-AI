plugins { id 'com.android.application' }
android {
    namespace 'com.jackyang.localai'
    compileSdk 35
    defaultConfig {
        applicationId 'com.jackyang.localai'
        minSdk 32
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            def propsFile = rootProject.file('signing.properties')
            if (propsFile.exists()) {
                def props = new Properties(); props.load(propsFile.newInputStream())
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']; keyAlias props['keyAlias']; keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release; debuggable project.hasProperty('thinApk') }
    }
    if (project.hasProperty('thinApk')) {
        sourceSets.main.assets.exclude 'model.gguf', 'runtime.zip'
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    // Sideloaded Termux runtime: API 28 preserves execution of its native userland.
    // This application is not submitted to Google Play.
    lint { disable 'ExpiredTargetSdkVersion' }
    androidResources { noCompress += ['gguf', 'zip'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { implementation project(':terminal-view') }
